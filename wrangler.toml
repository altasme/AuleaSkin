# Cloudflare Pages config for the Functions under functions/ (the admin
# panel's API). The static site itself (next build -> out/) doesn't need
# this file to deploy, Pages serves out/ either way; this only matters
# for the KV-backed API routes. See docs/admin-panel.md.
#
# IMPORTANT, learned the hard way: Cloudflare Pages reads this file
# during real production deploys too, not just local `wrangler pages
# dev`. A [[kv_namespaces]] block with a placeholder id here broke every
# production deployment's Function publish step with "Error 8000022:
# Invalid KV namespace ID" for as long as it existed, even though the
# real binding was correctly configured in the dashboard, the dashboard
# binding does NOT take precedence over this file, whatever this file
# declares wins. Do not add a [[kv_namespaces]] block back here unless
# it has the real, current namespace id. Local dev instead passes the
# binding on the command line (see docs/admin-panel.md, "Local
# development"), which needs no id at all.

name = "aulea-skin"
pages_build_output_dir = "out"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]
